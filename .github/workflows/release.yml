name: Create Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0 or 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - name: Validate and normalize version
        id: normalize
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error::Use a numeric version such as v0.3.0 or v0.3.'
            exit 1
          fi
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.tag }}

  build-macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml

  create-draft:
    name: Create release draft with both ZIPs
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: BMapper-windows-x64-${{ env.TAG }}
          path: release-assets/windows

      - name: Download macOS ZIP
        uses: actions/download-artifact@v4
        with:
          name: BMapper-macos-arm64
          path: release-assets/macos

      - name: Verify packages and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          windows="release-assets/windows/BMapper-windows-x64-$TAG.zip"
          macos="release-assets/macos/BMapper-macos-arm64-$TAG.zip"
          mv release-assets/macos/BMapper-macos-arm64.zip "$macos"
          unzip -tq "$windows"
          unzip -tq "$macos"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release or draft already exists for $TAG."
            exit 1
          fi

          tag_ref="refs/tags/$TAG"
          remote_refs="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          if [[ -n "$remote_refs" ]]; then
            tag_commit="$(awk -v ref="$tag_ref" '
              $2 == ref { direct = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled ? peeled : direct) }
            ' <<< "$remote_refs")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already points to $tag_commit, but this run built $GITHUB_SHA."
              exit 1
            fi
          else
            git push origin "$GITHUB_SHA:$tag_ref"
          fi

          gh release create "$TAG" "$windows" "$macos" \
            --verify-tag --draft --title "BMapper $TAG" --generate-notes
